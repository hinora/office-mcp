name: Build and Release WPS MCP

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build all MCP executables
        run: python build_exe.py --all

      - name: Create setup guide (README_SETUP.txt)
        shell: bash
        run: |
          cat > dist/README_SETUP.txt << 'GUIDE_EOF'
          ============================================================
            WPS MCP Servers — Setup & Configuration Guide
          ============================================================

          This archive includes the following six MCP servers:

            1. wps-excel-mcp.exe  — WPS Office Excel automation
            2. wps-word-mcp.exe   — WPS Office Word automation
            3. wps-slide-mcp.exe  — WPS Office Slide automation
            4. outlook-mcp.exe    — Microsoft Outlook automation
            5. mcp-meta.exe       — Web search & web fetch tools
            6. whatsapp-mcp.exe   — Read WhatsApp Desktop messages & media

          ============================================================
          System Requirements
          ============================================================

          - Windows 10 / 11 (x64)
          - No Python installation required (exe is self-contained)

          Required Office software:
            - WPS Office (for wps-excel-mcp, wps-word-mcp, and wps-slide-mcp)
            - Microsoft Outlook (for outlook-mcp)
            - WhatsApp Desktop installed and running (for whatsapp-mcp)
              Chrome with remote debugging: --remote-debugging-port=9222
            - None (mcp-meta is standalone — only needs a Brave API key for web-search)

          ============================================================
          Installation Steps
          ============================================================

          Step 1: Extract the files
          --------------------------
          Extract wps-mcp.zip to a directory of your choice, e.g.:
            C:\Tools\wps-mcp\

          After extraction you will see:
            C:\Tools\wps-mcp\
              ├── wps-excel-mcp.exe
              ├── wps-word-mcp.exe
              ├── wps-slide-mcp.exe
              ├── outlook-mcp.exe
              ├── mcp-meta.exe
              ├── whatsapp-mcp.exe
              └── README_SETUP.txt

          Step 2: Configure your MCP client
          ---------------------------------
          Add the exe paths to your MCP client config.

          --- VS Code / GitHub Copilot ---
          Edit .vscode\mcp.json (in your project or user config directory):

          {
            "servers": {
              "wps-excel-mcp": {
                "command": "C:\\Tools\\wps-mcp\\wps-excel-mcp.exe"
              },
              "wps-word-mcp": {
                "command": "C:\\Tools\\wps-mcp\\wps-word-mcp.exe"
              },
              "wps-slide-mcp": {
                "command": "C:\\Tools\\wps-mcp\\wps-slide-mcp.exe"
              },
              "outlook-mcp": {
                "command": "C:\\Tools\\wps-mcp\\outlook-mcp.exe"
              },
              "mcp-meta": {
                "command": "C:\\Tools\\wps-mcp\\mcp-meta.exe",
                "env": {
                  "BRAVE_API_KEY": "your-brave-api-key-here"
                }
              },
              "whatsapp-mcp": {
                "command": "C:\\Tools\\wps-mcp\\whatsapp-mcp.exe"
              }
            }
          }

          --- Claude Desktop ---
          Edit claude_desktop_config.json:
          (%APPDATA%\Claude\claude_desktop_config.json)

          {
            "mcpServers": {
              "wps-excel-mcp": {
                "command": "C:\\Tools\\wps-mcp\\wps-excel-mcp.exe"
              },
              "wps-word-mcp": {
                "command": "C:\\Tools\\wps-mcp\\wps-word-mcp.exe"
              },
              "wps-slide-mcp": {
                "command": "C:\\Tools\\wps-mcp\\wps-slide-mcp.exe"
              },
              "outlook-mcp": {
                "command": "C:\\Tools\\wps-mcp\\outlook-mcp.exe"
              },
              "mcp-meta": {
                "command": "C:\\Tools\\wps-mcp\\mcp-meta.exe",
                "env": {
                  "BRAVE_API_KEY": "your-brave-api-key-here"
                }
              },
              "whatsapp-mcp": {
                "command": "C:\\Tools\\wps-mcp\\whatsapp-mcp.exe"
              }
            }
          }

          --- Other MCP clients ---
          Use the same JSON format, pointing "command" to the exe path.

          Step 3: Test the connection
          ---------------------------
          Restart your AI assistant / MCP client, then try:
            - "List all Excel workbooks"  (wps-excel-mcp)
            - "Create a new Word document"  (wps-word-mcp)
            - "Create a presentation with 3 slides"  (wps-slide-mcp)
            - "Check my Outlook inbox"  (outlook-mcp)
            - "Search the web for TypeScript 5.5 features"  (mcp-meta)
            - "List my WhatsApp chats"  (whatsapp-mcp)

          ============================================================
          FAQ
          ============================================================

          Q: Nothing happens when I double-click the exe?
          A: These are MCP server programs designed to be called by an
             MCP client, not run directly. They communicate via stdio.

          Q: It says WPS Office is not found?
          A: Make sure WPS Office is installed. If it is installed and
             you still get an error, try opening WPS Office manually
             first, then start the MCP server.

          Q: Outlook MCP gives an error?
          A: Ensure Microsoft Outlook is installed and at least one
             email account is configured.

          Q: WhatsApp MCP says "Could not connect to Chrome"?
          A: Start Chrome with remote debugging enabled:
             chrome.exe --remote-debugging-port=9222
             Then open web.whatsapp.com and log in.

          Q: MCP Meta web-search gives "BRAVE_API_KEY not set"?
          A: Get a free API key at https://brave.com/search/api/ and
             set it in the "env" section of your MCP client config.

          Q: How do I uninstall?
          A: Simply delete the extracted folder. No other steps needed.

          ============================================================
          Version Info
          ============================================================

          Version: ${{ github.ref_name }}
          Repository: https://github.com/${{ github.repository }}

          Built with MCP (Model Context Protocol)
          https://modelcontextprotocol.io/
          GUIDE_EOF

      - name: Create ZIP archive
        shell: pwsh
        run: |
          $zipPath = "${{ github.workspace }}\wps-mcp.zip"
          if (Test-Path $zipPath) { Remove-Item $zipPath }
          Compress-Archive `
            -Path "dist\wps-excel-mcp.exe", "dist\wps-word-mcp.exe", "dist\wps-slide-mcp.exe", "dist\outlook-mcp.exe", "dist\mcp-meta.exe", "dist\whatsapp-mcp.exe", "dist\README_SETUP.txt" `
            -DestinationPath $zipPath `
            -CompressionLevel Optimal
          Write-Host "Created: $zipPath ($((Get-Item $zipPath).Length) bytes)"

      - name: Upload ZIP to release
        uses: softprops/action-gh-release@v2
        with:
          files: wps-mcp.zip
          token: ${{ secrets.GITHUB_TOKEN }}
