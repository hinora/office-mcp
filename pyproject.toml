[project]
name = "wps-mcp"
version = "0.1.0"
description = "MCP servers for WPS Office (Excel, Word, Slide) and Outlook automation via COM"
authors = [{name = "WPS MCP Developer"}]
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "pywin32>=306",
    "websockets>=12.0",
]

[project.optional-dependencies]
build-exe = ["pyinstaller>=6.0"]

[project.scripts]
wps-excel-mcp = "wps_excel_mcp.server:main"
wps-word-mcp = "wps_word_mcp.server:main"
wps-slide-mcp = "wps_slide_mcp.server:main"
outlook-mcp = "outlook_mcp.server:main"
mcp-meta = "mcp_meta.server:main"
whatsapp-mcp = "whatsapp_mcp.server:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
